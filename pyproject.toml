[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-voice-pipeline"
version = "0.1.0"
description = "Reusable methods for a model- and language-agnostic agricultural voice pipeline (Hindi/Telugu/Odia)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["jiwer>=3.0", "numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/aakashdg/agri-voice-pipeline"

[tool.setuptools]
packages = [
  "agri_voice_pipeline",
  "agri_voice_pipeline.phonetics",
  "agri_voice_pipeline.normalization",
  "agri_voice_pipeline.correction",
  "agri_voice_pipeline.evaluation",
  "agri_voice_pipeline.selection",
]

# Data lives at repo-root/data (bundled lexicon). If you pip-install away from the
# checkout, set AVP_DATA_DIR to point at that folder.
