<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="720" height="660" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283a"/></marker></defs>
<text x="360.0" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#16283a">M3 correction — precision-first, attested-only recovery (no LLM)</text>
<rect x="140" y="44" width="220" height="40" rx="8" fill="#e6e9ee" stroke="#5b6672" stroke-width="1.5"/>
<text x="250.0" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#16283a">ASR transcript token</text>
<line x1="250" y1="84" x2="250" y2="108" stroke="#16283a" stroke-width="1.6" marker-end="url(#ah)"/>
<polygon points="250,107.0 370.0,138 250,169.0 130.0,138" fill="#fff" stroke="#16283a" stroke-width="1.5"/>
<text x="250" y="134" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16283a">Seen in the ~100k</text>
<text x="250" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16283a">farmer-query corpus?</text>
<line x1="370" y1="138" x2="560" y2="138" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="376" y="132" font-size="11.5" font-weight="700" fill="#2a78d6">yes</text>
<rect x="560" y="118" width="150" height="44" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="635.0" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#2a78d6">Valid word —</text>
<text x="635.0" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#2a78d6">keep unchanged</text>
<line x1="250" y1="169" x2="250" y2="196" stroke="#16283a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="258" y="185" font-size="11.5" font-weight="700" fill="#16283a">no (garble)</text>
<polygon points="250,202.0 370.0,232 250,262.0 130.0,232" fill="#fff" stroke="#16283a" stroke-width="1.5"/>
<text x="250" y="228" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16283a">Already a valid</text>
<text x="250" y="244" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16283a">agricultural term?</text>
<line x1="370" y1="232" x2="560" y2="232" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="376" y="226" font-size="11.5" font-weight="700" fill="#2a78d6">yes</text>
<line x1="635" y1="162" x2="635" y2="214" stroke="#16283a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="560" y="214" width="150" height="36" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="635.0" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#2a78d6">keep unchanged</text>
<line x1="250" y1="262" x2="250" y2="292" stroke="#16283a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="258" y="278" font-size="11.5" font-weight="700" fill="#16283a">no</text>
<rect x="100" y="292" width="300" height="52" rx="8" fill="#fff" stroke="#16283a" stroke-width="1.5"/>
<text x="250.0" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="#16283a">Phoneme-match to high-criticality</text>
<text x="250.0" y="330" text-anchor="middle" font-size="11" font-weight="400" fill="#16283a">agri lexicon (feature-weighted edit dist.)</text>
<line x1="250" y1="344" x2="250" y2="372" stroke="#16283a" stroke-width="1.6" marker-end="url(#ah)"/>
<polygon points="250,374.0 400.0,420 250,466.0 100.0,420" fill="#fff" stroke="#16283a" stroke-width="1.5"/>
<text x="250" y="409" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16283a">Unique match, similarity ≥ 0.90,</text>
<text x="250" y="424" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16283a">target term attested,</text>
<text x="250" y="439" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16283a">not a diacritic-only variant?</text>
<line x1="250" y1="466" x2="250" y2="540" stroke="#16855a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="258" y="486" font-size="11.5" font-weight="700" fill="#16855a">yes</text>
<rect x="110" y="540" width="280" height="48" rx="8" fill="#e7f4ee" stroke="#16855a" stroke-width="1.5"/>
<text x="250.0" y="560" text-anchor="middle" font-size="12" font-weight="600" fill="#16855a">Recover — replace with the</text>
<text x="250.0" y="576" text-anchor="middle" font-size="12" font-weight="600" fill="#16855a">attested agricultural term</text>
<line x1="400" y1="420" x2="560" y2="420" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="406" y="414" font-size="11.5" font-weight="700" fill="#eb6834">no</text>
<rect x="548" y="384" width="168" height="72" rx="8" fill="#fdefe6" stroke="#eb6834" stroke-width="1.5"/>
<text x="632.0" y="398" text-anchor="middle" font-size="11.5" font-weight="600" fill="#eb6834">Ambiguous or</text>
<text x="632.0" y="416" text-anchor="middle" font-size="11.5" font-weight="600" fill="#eb6834">meaning-changing:</text>
<text x="632.0" y="432" text-anchor="middle" font-size="11.5" font-weight="600" fill="#eb6834">defer to context</text>
<text x="632.0" y="450" text-anchor="middle" font-size="10" font-weight="400" fill="#eb6834">(future work)</text>
<text x="360.0" y="644" text-anchor="middle" font-size="10.5" fill="#5b6672">Valid and already-correct words are never touched; only corpus-unseen garbles that confidently, uniquely match an attested term are rewritten.</text>
</svg>